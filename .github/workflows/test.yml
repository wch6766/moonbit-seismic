name: MoonBit CI

on:
  push:
  pull_request:

jobs:
  test:
    name: MoonBit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit on Unix
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\\.moon\\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install C compiler on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Show toolchain
        run: moon version --all

      - name: Update dependencies
        run: moon update

      - name: Check formatting
        run: |
          moon fmt
          git diff --exit-code

      - name: Check generated package interfaces
        run: |
          moon info
          git diff --exit-code

      - name: Check all targets
        run: moon check --target all --deny-warn

      - name: Test all targets
        run: moon test --target all --deny-warn

      - name: Native coverage smoke test
        if: runner.os == 'Linux'
        run: |
          moon test --target native --deny-warn --enable-coverage
          moon coverage report -f summary

      - name: Enforce production MoonBit source size
        if: runner.os == 'Linux'
        shell: bash
        run: |
          lines=$(find . -name '*.mbt' ! -name '*_test.mbt' ! -name '*_wbtest.mbt' -not -path './_build/*' -print0 | xargs -0 cat | wc -l)
          echo "Production MoonBit source lines: $lines"
          test "$lines" -ge 8000

      - name: Ensure generated files are committed
        run: git diff --exit-code
